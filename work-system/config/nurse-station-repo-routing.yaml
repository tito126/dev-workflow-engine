# 护士站仓库扫描路由配置
#
# 使用说明：
# 1. 任何护士站任务在进入多仓扫描、定位、实现前，都应先维护本文件。
# 2. 如果本文件未配置完成，skill 应停止继续推进，并明确要求用户先补全。
# 3. 允许先用"用户明确给出的唯一路径"做首扫，但一旦要扩扫到第二个仓库，必须受本文件约束。
# 4. 下方凡是带"TODO"或留空的字段，都视为"未配置完成"。
# 5. repos 下列出的是独立的 git 仓库路径，每个仓库有自己的 source_branch。

version: 2

# 配置状态。
# - draft: 草稿，未完成，禁止 skill 继续依赖本文件推进多仓扫描
# - ready: 已确认可用，允许按本文件执行扫描路由
status: ready

project:
  name: "护士站仓库扫描路由"
  scope: "住院护士站"

routing_policy:
  allow_user_repo_as_primary: true
  block_multi_repo_scan_when_yaml_not_ready: true
  enforce_whitelist_on_expansion: true
  require_findings_scan_log: true

roots:
  backend_main: "E:\\winning-code\\akso5\\winning-nis-ward"
  frontend_workspace: "E:\\winning-code\\frontend\\webui-next"
  optional_allowed_roots: []

repos:
  backend_main:
    path: "E:\\winning-code\\akso5\\winning-nis-ward"
    source_branch: "sr-next"

  admin_execution_inpatient:
    path: "E:\\winning-code\\frontend\\webui-next\\winning-webui-admin-execution-inpatient"
    source_branch: "sr-next"
    description: "住院定义态配置页面"

  webui_inpatient_bedcard:
    path: "E:\\winning-code\\frontend\\webui-next\\winning-webui-inpatient-bedcard"
    source_branch: "sr-next"
    description: "床位卡页面"

  encounter_filter:
    path: "E:\\winning-code\\frontend\\webui-next\\winning-webmaterials-encounter"
    source_branch: "develop"
    description: "就诊筛选公共组件（monorepo，组件在 components/win-encounter-filter）"

git_defaults:
  auto_pull: true
  fetch_first: true
  use_worktree: false
  worktree_base_dir: ""

task_policy:
  prefer_split_tasks: true
  branch_pattern: "feature/{taskId}"
  auto_create_task_when_missing: false
  frontend_task_keywords:
    - "前端"
    - "web"
    - "vue"
    - "页面"
  backend_task_keywords:
    - "后端"
    - "java"
    - "接口"
    - "服务"

exclude_roots:
  - "E:\\winning-code\\work"
  - "E:\\winning-code\\ai"

keyword_routes:
  ui_text_like:
    keywords:
      - "页面"
      - "文案"
      - "说明"
      - "提示"
      - "按钮"
      - "弹窗"
      - "tooltip"
      - "popover"
      - "vue"
      - "路由"
    prefer_repos:
      - "admin_execution_inpatient"
      - "webui_inpatient_bedcard"
  backend_like:
    keywords:
      - "接口"
      - "controller"
      - "service"
      - "repository"
      - "dto"
      - "bo"
      - "entity"
      - "规则"
      - "参数"
      - "sql"
    prefer_repos:
      - "backend_main"
  config_like:
    keywords:
      - "配置"
      - "参数"
      - "首日"
      - "医嘱流向"
      - "物资流向"
      - "帮助说明"
    prefer_repos:
      - "backend_main"
      - "admin_execution_inpatient"

scan_record_template:
  required_fields:
    - "yaml路由文件"
    - "首扫仓库"
    - "首扫仓库来源"
    - "实际扫描仓库"
    - "被排除的仓库"
    - "扩扫触发原因"

validation:
  fail_if_contains_todo: true
  require_non_empty_repos:
    - "backend_main"
    - "admin_execution_inpatient"

notes:
  - "先首扫用户明确给的仓库，再决定是否扩扫。"
  - "扩扫只能落在 YAML 白名单仓库内，不能凭记忆猜目录。"
  - "如果当前任务只在用户给定的唯一仓库内即可完成，可不依赖 YAML 扩扫。"
  - "直接在本地仓库目录修改，不使用 worktree。"
